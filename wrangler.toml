name = "oblivionstore"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
FRONTEND_URL = "*"
CHECKOUT_TTL_MINUTES = "15"
DEFAULT_QRIS_IMAGE = "https://upload.wikimedia.org/wikipedia/commons/d/d0/QR_code_for_mobile_English_Wikipedia.svg"

[[d1_databases]]
binding = "DB"
database_name = "oblivionstore-db"
database_id = "GANTI_DENGAN_DATABASE_ID_D1_ANDA"

# Opsional: Aktifkan bagian R2 di bawah ini jika sudah mengaktifkan R2 Storage
# Jika belum memakai R2, biarkan terkomentar (#) dan gunakan URL File / URL Gambar eksternal di Admin Panel.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "oblivionstore-bucket"

# Tambahkan Secret via Dashboard Cloudflare (Settings -> Variables and Secrets):
# ADMIN_PASSWORD = "oblivionstore123"
# WEBHOOK_SECRET = "rahasia-webhook-anda"
